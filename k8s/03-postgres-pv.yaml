# Volume local, adapte a minikube. Sur un cloud on remplacerait ce PV
# par une StorageClass dynamique (ex. gp2, standard).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    role: base-de-donnees
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: todo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
  selector:
    matchLabels:
      role: base-de-donnees
